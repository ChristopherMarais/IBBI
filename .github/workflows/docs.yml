name: Deploy documentation

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write # push the built site to the gh-pages branch

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy-docs:
    name: Build and deploy the MkDocs site to gh-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true # the logo and PNG figures are stored with Git LFS

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install MkDocs
        # the API reference is read from src/ statically (mkdocstrings paths: [src]), so the package itself is not needed
        run: |
          python -m pip install --upgrade pip
          pip install "mkdocs>=1.6,<2" "mkdocs-material>=9.6,<10" "mkdocstrings[python]>=0.29"

      - name: Build (strict)
        run: mkdocs build --strict

      - name: Deploy to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdocs gh-deploy --force -m "Deploy docs for ${{ github.ref_name }} ({sha})"
