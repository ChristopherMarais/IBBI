name: Publish Python Package to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.3.0), for re-running a release whose publish failed"
        required: true

jobs:
  pypi-publish:
    name: Build and publish package to PyPI
    runs-on: ubuntu-latest
    environment:
      name: ibbi_pypi
      url: https://pypi.org/p/ibbi
    permissions:
      id-token: write # Required for trusted publishing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1

      # Building the sdist and wheel needs only Poetry itself, not the package's dependencies.

      - name: Remove old build artifacts
        run: rm -rf dist/

      - name: Set version
        run: |
          # From the release tag (v0.3.0 -> 0.3.0), or from the manual input when run by hand.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          fi
          poetry version "$VERSION"

      - name: Build package
        run: poetry build

      - name: Check the built package
        run: |
          pip install twine
          twine check dist/*

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
