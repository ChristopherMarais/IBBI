# mkdocs.yml

site_name: IBBI Documentation
site_description: Detection, hierarchical identification and benchmarking of bark and ambrosia beetles.
site_url: https://gcmarais.com/IBBI/
repo_url: https://github.com/ChristopherMarais/IBBI
repo_name: ChristopherMarais/IBBI
edit_uri: ""

theme:
  name: material
  palette:
    # Palette toggle for light vs dark mode
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  logo: assets/images/IBBI_logo.png
  favicon: assets/images/IBBI_logo.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            docstring_options:
              warn_missing_types: false
            show_root_heading: true
            show_source: false
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            filters: ["!^_"]

nav:
  - Home: index.md
  - 'User Documentation':
    - 'Usage Guide': usage.md
    - 'Models': models.md
    - 'Benchmark Results': benchmark.md
    - 'Changelog': changelog.md
  - 'API':
    - 'Reference': api.md
  - 'Development':
    - 'Contributing': CONTRIBUTING.md
    - 'License': LICENSE.md

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
