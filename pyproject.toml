[tool.poetry]
name = "ibbi"
version = "0.0.0"
description = "Detection, hierarchical identification and benchmarking of bark and ambrosia beetles."
authors = ["G. Christopher Marais"]
license = "MIT"
readme = "README.md"
documentation = "https://gcmarais.com/IBBI/"
repository = "https://github.com/ChristopherMarais/IBBI"
packages = [{ include = "ibbi", from = "src" }]

[tool.setuptools.package-data]
"ibbi.data" = ["*.csv"]

[[tool.poetry.source]]
name = "pytorch_cu128"
url = "https://download.pytorch.org/whl/cu128"
priority = "explicit"

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
huggingface-hub = ">=1.0"
ultralytics = ">=8.3.139,<8.4"
transformers = ">=5.0"
timm = ">=1.0.20"
open-clip-torch = ">=2.30"
safetensors = ">=0.4"
pycocotools = ">=2.0.8"
pandas = ">=2.2"
numpy = ">=1.26"
pillow = ">=10.0"
requests = ">=2.31"
tqdm = ">=4.66"
scikit-learn = ">=1.4"
scikit-image = ">=0.22"
matplotlib = ">=3.8"
shap = ">=0.48"
lime = ">=0.2.0.1"
scikit-bio = ">=0.7"
umap-learn = ">=0.5.9"
torch = { version = ">=2.4", source = "pytorch_cu128" }
torchvision = { version = ">=0.19", source = "pytorch_cu128" }

[tool.poetry.group.dev.dependencies]
ruff = "^0.11.10"
pyright = "^1.1.405"
pytest = "^8.3.5"
pre-commit = "^4.2.0"
mkdocs = "^1.6.1"
mkdocs-material = "^9.6.14"
jupyterlab = "^4.4.2"
isort = "^6.0.1"
black = "^25.1.0"
notebook = "^7.4.2"
ipykernel = "^6.29.5"
ipywidgets = "^8.1.7"
mkdocstrings = "^0.29.1"
mkdocstrings-python = "^1.16.12"
poetry-dynamic-versioning = "^1.8.2"

[build-system]
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning"]
build-backend = "poetry.core.masonry.api"


# --- Tool Configurations ---

[tool.ruff]
extend-exclude = ["src/ibbi/evaluate/_reference_evaluator.py"]
line-length = 150

[tool.ruff.lint]
select = ["A", "B", "C4", "E", "W", "F", "I", "UP", "RUF"]
ignore = [
    "B007",
    "E721",
    "RUF015",
    "C401",
    "C408",
    "C409",
    "B905",   # zip() without strict=: lengths are equal by construction
    "RUF001", # en dashes in table output are intended
    "RUF012", # class-level defaults in test fakes
    "RUF046",
    "RUF059",
    "UP007",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"benchmarks/*" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.isort]
known-first-party = ["ibbi"]


[tool.pyright]
include = ["src/ibbi", "tests"]
exclude = ["**/node_modules", "**/__pycache__"]
stubPath = "src/stubs"
reportMissingImports = true
pythonVersion = "3.11"


[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]

[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
style = "pep440"
# format-latest = "{base}.dev{distance}"
